{% extends 'base.html' %}
{% block title %}Password Reset Complete — STYLEVERSE{% endblock %}
{% block content %}
<section class="sv-section">
  <div class="sv-container" style="max-width: 760px;">
    <div class="sv-auth__card">
      <span class="sv-auth__eyebrow">Security</span>
      <h1>Password Reset Complete</h1>
      <p class="sv-auth__subtitle">Your password has been updated successfully. You can now sign in with your new
        credentials.</p>
      <a class="sv-btn sv-btn--lg" href="{% url 'login' %}">Go to Login</a>
    </div>
  </div>
</section>
{% endblock %}
