{% extends 'base.html' %}
{% block title %}Contact — STYLEVERSE{% endblock %}
{% block content %}
<main class="contact-section">
    <h1>Get in Touch</h1>
    <p class="subtitle">We'd love to hear from you. Fill out the form and we'll get back within 24 hours.</p>

    <form class="contact-form" action="#" method="POST">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first-name" placeholder="John" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" name="last-name" placeholder="Doe" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="hello@example.com" required>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="How can we help you?" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <button type="submit" class="sv-btn sv-btn--lg sv-btn--full">Send Message</button>
    </form>
</main>
{% endblock %}
